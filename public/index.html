<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínica — Gestión de Horarios</title>
  <meta name="description" content="Sistema de gestión y distribución de turnos para clínica. Generación automática, edición drag & drop y exportación." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/schedule-grid.css" />
</head>
<body>

<!-- ── LOGIN OVERLAY ───────────────────────────────────────────────── -->
<div id="login-overlay" class="login-overlay hidden">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🏥</div>
      <h1>Gestión de Horarios</h1>
      <p>Sistema de turnos clínica</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="login-user">Usuario</label>
        <input id="login-user" type="text" placeholder="admin" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="login-pass">Contraseña</label>
        <input id="login-pass" type="password" placeholder="••••••" autocomplete="current-password" />
      </div>
      <div id="login-error" class="form-error hidden"></div>
      <button id="login-btn" type="submit" class="btn btn-primary btn-full">
        <span class="btn-text">Entrar</span>
        <span class="btn-spinner hidden">⏳</span>
      </button>
    </form>
  </div>
</div>

<!-- ── APP SHELL ───────────────────────────────────────────────────── -->
<div id="app" class="app-shell hidden">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🏥</div>
      <div class="sidebar-title">
        <span class="sidebar-name">Horarios</span>
        <span class="sidebar-sub">Clínica</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="#dashboard"  class="nav-item" data-view="dashboard">
        <span class="nav-icon">📊</span><span class="nav-label">Dashboard</span>
      </a>
      <a href="#schedule"   class="nav-item" data-view="schedule">
        <span class="nav-icon">📅</span><span class="nav-label">Horarios</span>
      </a>
      <a href="#employees"  class="nav-item" data-view="employees">
        <span class="nav-icon">👥</span><span class="nav-label">Empleados</span>
      </a>
      <a href="#history"    class="nav-item" data-view="history">
        <span class="nav-icon">📂</span><span class="nav-label">Historial</span>
      </a>
      <a href="#config"     class="nav-item" data-view="config">
        <span class="nav-icon">⚙️</span><span class="nav-label">Configuración</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button id="logout-btn" class="btn btn-ghost btn-sm">
        <span>🚪</span> Salir
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <div id="view-container"></div>
  </main>

</div>

<!-- ── TOAST NOTIFICATIONS ─────────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── MODAL OVERLAY ──────────────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-box" class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button id="modal-close" class="modal-close">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-footer" class="modal-footer"></div>
  </div>
</div>

<!-- ── SCRIPTS ─────────────────────────────────────────────────────── -->
<script src="/lib/sortable.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/views/dashboard.js"></script>
<script src="/js/views/schedule-editor.js"></script>
<script src="/js/views/employees.js"></script>
<script src="/js/views/history.js"></script>
<script src="/js/views/config.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
